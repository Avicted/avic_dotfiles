--[[
    conky configuration
    Ryzen 9 3950X  ·  Radeon RX 6800 XT  ·  NZXT Kraken 2 AIO  ·  ASUS board

    Sensors are read straight from sysfs via ${hwmon <module> ...}, which matches
    hwmon devices by module name and therefore survives hwmon renumbering across
    reboots.  Run `sensors` to see the raw values these map to.

        k10temp   temp1 Tctl      temp3 Tccd1     temp4 Tccd2
        amdgpu    temp1 edge      temp2 junction  temp3 mem      fan1 GPU fan
        kraken2   temp1 Coolant   fan2  Pump
        asusec    temp1 Chipset   temp2 CPU       temp3 Motherboard  temp5 VRM
                  fan1  CPU_Opt   fan2  Chipset
        nvme      temp1 Composite

    Column layout is done with ${goto <px>}, not padding spaces:
        left  label 10   value 85
        right label 190  value 280
        bars in the storage block start at 280 and are 110 wide
        full-width bars start at 10 and are 380 wide (minimum_width 400)
]]

conky.config = {
    alignment = 'top_right',
    background = false,
    xftalpha = 1.0,
    border_width = 1,
    gap_x = 3080,
    gap_y = 140,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'black',
    default_shade_color = 'black',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'JetBrains mono:size=12',
    minimum_width = 400,
    minimum_height = 5,
    no_buffers = false,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 150,
    own_window_colour = 'black',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 5,
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
    top_name_width = 14,
    -- single-letter units (G, not GiB); sizes below append a literal B -> "GB".
    -- conky always scales by 1024, so "GB" here is really GiB.
    short_units = true,

    -- palette
    color1 = 'fdd69d',  -- section headings
    color2 = '9AA3AD',  -- labels
    color3 = 'FFFFFF',  -- values
    color4 = 'FFB454',  -- warning
    color5 = 'FF5555',  -- critical

    -- \1 hwmon module  \2 sensor index  \3 warn threshold  \4 critical threshold
    template1 = [[${if_match ${hwmon \1 temp \2} > \4}${color5}${else}${if_match ${hwmon \1 temp \2} > \3}${color4}${else}${color3}${endif}${endif}${hwmon \1 temp \2}°C]],
    -- \1 hwmon module  \2 fan index
    template2 = [[${color3}${hwmon \1 fan \2} rpm]],
    -- \1 label  \2 mount point
    template3 = [[${color2}${goto 10}\1${if_mounted \2}${color3}${goto 85}${fs_used_perc \2}%${goto 130}${fs_used \2}/${fs_size \2}B${goto 280}${fs_bar 6,110 \2}${else}${color2}${goto 85}not mounted${endif}]],
}

conky.text = [[
${color1}${alignc}${exec whoami}@${nodename}  ·  ${kernel}
${color2}${stippled_hr}
${color2}${goto 10}${time %a, %d %B}${alignr 10}${color2}up ${color3}${uptime_short}
${color3}${goto 10}${time %H:%M:%S}${alignr 10}${color2}gov ${color3}${cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor}
${color2}${stippled_hr}
${color1}${goto 10}CPU${color2}${goto 55}Ryzen 9 3950X${color3}${goto 250}${freq_g} GHz${goto 350}${cpu}%
${color3}${goto 10}${cpubar 6,380}
${color2}${goto 10}Tctl${goto 85}${template1 k10temp 1 75 88}${color2}${goto 190}CCD1${goto 280}${template1 k10temp 3 75 88}
${color2}${goto 10}Socket${goto 85}${template1 asusec 2 75 88}${color2}${goto 190}CCD2${goto 280}${template1 k10temp 4 75 88}
${color2}${stippled_hr}
${color2}${goto 10}Pump${goto 85}${if_match ${hwmon kraken2 fan 2} < 500}${color5}${hwmon kraken2 fan 2} rpm STOP${else}${color3}${hwmon kraken2 fan 2} rpm${endif}${color2}${goto 190}Coolant${goto 280}${template1 kraken2 1 40 50}
${color2}${goto 10}CPU fan${goto 85}${template2 asusec 1}${color2}${goto 190}Chip fan${goto 280}${template2 asusec 2}
${color2}${stippled_hr}
${color1}${goto 10}GPU${color2}${goto 55}RX 6800 XT${color3}${goto 250}${execi 3 awk '{printf "%.0f W", $1/1000000}' /sys/class/drm/card*/device/hwmon/hwmon*/power1_average}${goto 350}${execi 2 cat /sys/class/drm/card*/device/gpu_busy_percent}%
${color3}${goto 10}${execibar 2 6,380 cat /sys/class/drm/card*/device/gpu_busy_percent}
${color2}${goto 10}Edge${goto 85}${template1 amdgpu 1 75 90}${color2}${goto 190}Junction${goto 280}${template1 amdgpu 2 90 105}
${color2}${goto 10}Mem${goto 85}${template1 amdgpu 3 85 95}${color2}${goto 190}Fan${goto 280}${template2 amdgpu 1}
${color2}${goto 10}VRAM${color3}${goto 85}${execi 5 awk 'FILENAME ~ /used$/ {u=$1} FILENAME ~ /total$/ {t=$1} END {printf "%.1f/%.1fGB", u/2^30, t/2^30}' /sys/class/drm/card*/device/mem_info_vram_used /sys/class/drm/card*/device/mem_info_vram_total}${goto 280}${execibar 5 6,110 awk 'FILENAME ~ /used$/ {u=$1} FILENAME ~ /total$/ {t=$1} END {printf "%.0f", 100*u/t}' /sys/class/drm/card*/device/mem_info_vram_used /sys/class/drm/card*/device/mem_info_vram_total}
${color2}${stippled_hr}
${color2}${goto 10}Board${goto 85}${template1 asusec 3 50 60}${color2}${goto 190}VRM${goto 280}${template1 asusec 5 70 90}
${color2}${goto 10}Chipset${goto 85}${template1 asusec 1 70 85}${color2}${goto 190}NVMe${goto 280}${template1 nvme 1 65 80}
${color2}${stippled_hr}
${color2}${goto 10}RAM${color3}${goto 85}${memperc}%${goto 130}${mem}/${memmax}B${goto 280}${membar 6,110}
${color2}${goto 10}Swap${color3}${goto 85}${swapperc}%${goto 130}${swap}/${swapmax}B${goto 280}${swapbar 6,110}
${color2}${goto 10}Root${color3}${goto 85}${fs_used_perc /}%${goto 130}${fs_used /}/${fs_size /}B${goto 280}${fs_bar 6,110 /}
${template3 Work /run/media/avic/WorkSSD}
${template3 Media /run/media/avic/media}
${color2}${stippled_hr}
${color2}${goto 10}Net${color3}${goto 85}↓ ${downspeed enp4s0}/s${goto 220}↑ ${upspeed enp4s0}/s${alignr 10}${if_existing /sys/class/net/wg0-mullvad}${color1}vpn${else}${color5}no vpn${endif}
${color2}${stippled_hr}
${color1}${goto 10}Process${goto 235}CPU%${goto 310}MEM%${alignr 10}User
${color3}${goto 10}${top name 1}${goto 215}${top cpu 1}${goto 290}${top mem 1}${alignr 10}${top user 1}
${color3}${goto 10}${top name 2}${goto 215}${top cpu 2}${goto 290}${top mem 2}${alignr 10}${top user 2}
${color3}${goto 10}${top name 3}${goto 215}${top cpu 3}${goto 290}${top mem 3}${alignr 10}${top user 3}
${color3}${goto 10}${top name 4}${goto 215}${top cpu 4}${goto 290}${top mem 4}${alignr 10}${top user 4}
${color3}${goto 10}${top name 5}${goto 215}${top cpu 5}${goto 290}${top mem 5}${alignr 10}${top user 5}
${color2}${stippled_hr}
${color2}${goto 10}Vaasa${color3}${goto 85}${execi 1800 curl -s --max-time 10 'https://wttr.in/Vaasa?format=%t+%w'}${color2}${goto 215}${execi 1800 curl -s --max-time 10 'https://wttr.in/Vaasa?format=%C' | cut -c1-18}
]]
